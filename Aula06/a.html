```html
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>inscrição / contato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container py-4">
        <form class="border rounded p-4">
            <h2>inscrição / contato</h2>
            <p class="text-muted">preencha os campos abaixo. campos marcados com * são obrigatórios.</p>

            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nome" class="form-label">nome *</label>
                    <input type="text" class="form-control" id="nome" placeholder="joão" required>
                </div>

                <div class="col-md-6">
                    <label for="sobrenome" class="form-label">sobrenome *</label>
                    <input type="text" class="form-control" id="sobrenome" placeholder="silva" required>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">email *</label>
                    <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
                </div>

                <div class="col-md-6">
                    <label for="telefone" class="form-label">telefone</label>
                    <input type="tel" class="form-control" id="telefone" placeholder="(11) 91234-5678">
                </div>

                <div class="col-md-6">
                    <label for="cpf" class="form-label">cpf *</label>
                    <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="col-md-6">
                    <label for="nascimento" class="form-label">data de nascimento</label>
                    <input type="date" class="form-control" id="nascimento">
                </div>

                <div class="col-md-6">
                    <label for="senha" class="form-label">senha *</label>
                    <input type="password" class="form-control" id="senha" placeholder="mínimo 6 caracteres" minlength="6" required>
                </div>

                <div class="col-md-6">
                    <label for="funcao" class="form-label">função</label>
                    <select class="form-select" id="funcao">
                        <option value="" selected>escolha...</option>
                        <option>estudante</option>
                        <option>desenvolvedor</option>
                        <option>designer</option>
                        <option>outro</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="usuario" class="form-label">usuário</label>
                    <div class="input-group">
                        <span class="input-group-text">@</span>
                        <input type="text" class="form-control" id="usuario" placeholder="nomeusuario">
                    </div>
                </div>

                <div class="col-12">
                    <label for="mensagem" class="form-label">mensagem</label>
                    <textarea class="form-control" id="mensagem" rows="4" placeholder="escreva aqui..."></textarea>
                </div>

                <div class="col-12">
                    <label for="curriculo" class="form-label">upload de currículo (pdf)</label>
                    <input type="file" class="form-control" id="curriculo" accept="application/pdf">
                    <div class="form-text">máx. 5mb. apenas pdf.</div>
                </div>

                <div class="col-12 d-flex flex-wrap gap-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="novidades">
                        <label class="form-check-label" for="novidades">quero receber novidades</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="contato" id="contato-email" value="email" checked>
                        <label class="form-check-label" for="contato-email">contato por email</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="contato" id="contato-telefone" value="telefone">
                        <label class="form-check-label" for="contato-telefone">contato por telefone</label>
                    </div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">enviar</button>
                    <button type="reset" class="btn btn-outline-secondary">limpar</button>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
```
